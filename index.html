n */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"fc122e17-cc33-4798-9a12-3a32a8f98272\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --paper: oklch(0.985 0.004 80);\n    --paper-2: oklch(0.965 0.006 75);\n    --ink: oklch(0.20 0.012 60);\n    --ink-2: oklch(0.38 0.012 60);\n    --ink-3: oklch(0.55 0.012 60);\n    --rule: oklch(0.86 0.008 70);\n    --accent: oklch(0.52 0.09 40);\n    --serif: \"Instrument Serif\", \"Times New Roman\", serif;\n    --sans: \"Geist\", -apple-system, BlinkMacSystemFont, sans-serif;\n    --mono: \"Geist Mono\", ui-monospace, monospace;\n  }\n\n  *{ box-sizing: border-box; }\n  html, body{ margin:0; padding:0; }\n  body{\n    background: var(--paper-2);\n    color: var(--ink);\n    font-family: var(--sans);\n    font-weight: 400;\n    font-size: 14px;\n    line-height: 1.55;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  .page{\n    max-width: 880px;\n    margin: 48px auto;\n    background: var(--paper);\n    padding: 80px 88px 96px;\n    box-shadow: 0 1px 0 oklch(0.92 0.006 70), 0 30px 60px -30px oklch(0.4 0.02 60 / 0.18);\n    border-radius: 2px;\n  }\n\n  /* ── Header ───────────────────────────────────────────────────── */\n  header.masthead{\n    display: grid;\n    grid-template-columns: 1fr auto;\n    align-items: center;\n    gap: 36px;\n    padding-bottom: 28px;\n    border-bottom: 1px solid var(--rule);\n  }\n  .masthead-text{ display: flex; flex-direction: column; gap: 18px; }\n  .portrait{\n    width: 150px;\n    height: 180px;\n    object-fit: cover;\n    object-position: center 18%;\n    filter: grayscale(1) contrast(1.04);\n    border-radius: 2px;\n    background: var(--paper-2);\n    box-shadow: 0 1px 0 var(--rule);\n  }\n  .name{\n    font-family: var(--serif);\n    font-weight: 400;\n    font-size: 64px;\n    line-height: 0.95;\n    letter-spacing: -0.01em;\n    margin: 0;\n    color: var(--ink);\n  }\n  .name em{\n    font-style: italic;\n    color: var(--accent);\n  }\n  .role{\n    font-family: var(--sans);\n    font-size: 13px;\n    color: var(--ink-2);\n    letter-spacing: 0.01em;\n    margin-top: 14px;\n    max-width: 56ch;\n    text-wrap: balance;\n  }\n  .contact{\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--ink-2);\n    text-align: right;\n    line-height: 1.8;\n    letter-spacing: 0.01em;\n  }\n  .contact-inline{\n    text-align: left;\n    display: flex;\n    flex-wrap: wrap;\n    gap: 4px 18px;\n    line-height: 1.7;\n  }\n  .contact div{ white-space: nowrap; }\n  .contact a{\n    color: inherit;\n    text-decoration: none;\n    border-bottom: 1px solid var(--rule);\n    transition: color 0.15s ease, border-color 0.15s ease;\n  }\n  .contact a:hover{\n    color: var(--accent);\n    border-bottom-color: var(--accent);\n  }\n\n  /* ── Section frame ────────────────────────────────────────────── */\n  section{\n    display: grid;\n    grid-template-columns: 140px 1fr;\n    gap: 32px;\n    padding: 36px 0 32px;\n    border-bottom: 1px solid var(--rule);\n  }\n  section:last-of-type{ border-bottom: none; }\n\n  .sec-label{\n    font-family: var(--mono);\n    font-size: 12px;\n    text-transform: uppercase;\n    letter-spacing: 0.12em;\n    color: var(--accent);\n    background: oklch(0.94 0.004 70);\n    padding: 9px 13px;\n    border-radius: 2px;\n    align-self: start;\n    line-height: 1.25;\n    font-weight: 500;\n  }\n  .sec-label .num{\n    display: block;\n    color: var(--accent);\n    font-size: 10.5px;\n    margin-bottom: 5px;\n    font-weight: 500;\n    letter-spacing: 0.16em;\n    opacity: 0.75;\n  }\n\n  .sec-body > * + *{ margin-top: 14px; }\n  .sec-body p{ margin: 0; max-width: 70ch; text-wrap: pretty; }\n\n  /* Profile paragraphs */\n  .profile p{\n    font-family: var(--serif);\n    font-size: 15px;\n    line-height: 1.5;\n    color: var(--ink);\n    max-width: 62ch;\n    font-weight: 400;\n    text-align: justify;\n    hyphens: auto;\n    -webkit-hyphens: auto;\n  }\n  .profile p + p{ margin-top: 12px; }\n\n  /* ── Skills ───────────────────────────────────────────────────── */\n  .skills-group{ }\n  .skills-group + .skills-group{ margin-top: 22px; }\n  .skills-group h3{\n    font-family: var(--sans);\n    font-weight: 500;\n    font-size: 12px;\n    text-transform: uppercase;\n    letter-spacing: 0.08em;\n    color: var(--ink);\n    margin: 0 0 10px;\n  }\n  .skill-row{\n    display: grid;\n    grid-template-columns: 170px 1fr;\n    gap: 20px;\n    padding: 8px 0;\n    border-top: 1px dotted var(--rule);\n  }\n  .skill-row:first-of-type{ border-top: 1px solid var(--rule); }\n  .skill-row dt{\n    font-family: var(--mono);\n    font-size: 10.5px;\n    text-transform: uppercase;\n    letter-spacing: 0.06em;\n    color: var(--ink-3);\n    padding-top: 2px;\n  }\n  .skill-row dd{\n    margin: 0;\n    font-size: 13.5px;\n    color: var(--ink);\n    line-height: 1.55;\n  }\n\n  /* ── Experience ───────────────────────────────────────────────── */\n  .job{ }\n  .job + .job{\n    margin-top: 32px;\n    padding-top: 28px;\n    border-top: 1px dotted var(--rule);\n  }\n  .job-head{\n    display: grid;\n    grid-template-columns: 1fr auto;\n    align-items: baseline;\n    gap: 16px;\n    margin-bottom: 4px;\n  }\n  .job-title{\n    font-family: var(--serif);\n    font-size: 26px;\n    line-height: 1.15;\n    font-weight: 400;\n    color: var(--ink);\n    margin: 0;\n    letter-spacing: -0.005em;\n  }\n  .job-dates{\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--accent);\n    letter-spacing: 0.04em;\n    white-space: nowrap;\n  }\n  .job-org{\n    font-family: var(--sans);\n    font-size: 13px;\n    color: var(--ink-2);\n    margin: 0 0 14px;\n    font-style: italic;\n  }\n  .job ul{\n    list-style: none;\n    margin: 12px 0 0;\n    padding: 0;\n  }\n  .job ul li{\n    position: relative;\n    padding: 6px 0 6px 22px;\n    font-size: 13.5px;\n    color: var(--ink);\n    line-height: 1.55;\n    max-width: 72ch;\n  }\n  .job ul li::before{\n    content: \"\";\n    position: absolute;\n    left: 0;\n    top: 16px;\n    width: 10px;\n    height: 1px;\n    background: var(--ink-3);\n  }\n  .job ul li + li{ border-top: 1px dotted var(--rule); }\n\n  /* ── Achievements ─────────────────────────────────────────────── */\n  .achievements{\n    counter-reset: achv;\n    list-style: none;\n    margin: 0;\n    padding: 0;\n  }\n  .achievements li{\n    counter-increment: achv;\n    display: grid;\n    grid-template-columns: 32px 1fr;\n    gap: 16px;\n    padding: 14px 0;\n    border-top: 1px dotted var(--rule);\n    font-size: 13.5px;\n    line-height: 1.55;\n    max-width: 78ch;\n  }\n  .achievements li:first-child{ border-top: 1px solid var(--rule); }\n  .achievements li::before{\n    content: \"0\" counter(achv);\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--accent);\n    letter-spacing: 0.04em;\n    padding-top: 3px;\n  }\n\n  /* ── Education / Certs ────────────────────────────────────────── */\n  .entry{\n    padding: 12px 0;\n    display: grid;\n    grid-template-columns: 1fr auto;\n    gap: 16px;\n    align-items: baseline;\n    border-top: 1px dotted var(--rule);\n  }\n  .entry:first-of-type{ border-top: 1px solid var(--rule); }\n  .entry h4{\n    font-family: var(--serif);\n    font-weight: 400;\n    font-size: 18px;\n    line-height: 1.2;\n    margin: 0 0 4px;\n    color: var(--ink);\n  }\n  .entry .meta{\n    font-family: var(--sans);\n    font-size: 12.5px;\n    color: var(--ink-2);\n    margin: 0;\n  }\n  .entry .when{\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--accent);\n    letter-spacing: 0.04em;\n    white-space: nowrap;\n  }\n\n  /* ── Pills (formación complementaria) ─────────────────────────── */\n  .pills{\n    display: flex;\n    flex-wrap: wrap;\n    gap: 8px 10px;\n    list-style: none;\n    margin: 0;\n    padding: 0;\n  }\n  .pills li{\n    font-family: var(--mono);\n    font-size: 11px;\n    text-transform: uppercase;\n    letter-spacing: 0.06em;\n    color: var(--ink-2);\n    padding: 6px 12px;\n    border: 1px solid var(--rule);\n    border-radius: 999px;\n  }\n\n  /* ── Languages ────────────────────────────────────────────────── */\n  .langs{\n    display: grid;\n    grid-template-columns: repeat(2, 1fr);\n    gap: 16px 32px;\n    margin: 0;\n    padding: 0;\n    list-style: none;\n  }\n  .langs li{\n    border-top: 1px solid var(--rule);\n    padding-top: 10px;\n    font-family: var(--sans);\n    font-size: 14px;\n    color: var(--ink);\n    display: flex;\n    justify-content: space-between;\n    align-items: baseline;\n    gap: 12px;\n  }\n  .langs li span{\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--ink-3);\n    letter-spacing: 0.04em;\n  }\n\n  /* ── Footer note ──────────────────────────────────────────────── */\n  .colophon{\n    margin-top: 40px;\n    padding-top: 24px;\n    border-top: 1px solid var(--rule);\n    font-family: var(--mono);\n    font-size: 10.5px;\n    color: var(--ink-3);\n    letter-spacing: 0.04em;\n    text-align: center;\n    text-transform: uppercase;\n  }\n\n  /* Print */\n  @media print{\n    body{ background: white; }\n    .page{\n      box-shadow: none;\n      margin: 0;\n      max-width: none;\n      padding: 36px 48px;\n    }\n    section{ break-inside: avoid; }\n    .job{ break-inside: avoid; }\n  }\n\n  @media (max-width: 760px){\n    .page{ padding: 40px 24px 56px; margin: 16px; }\n    .name{ font-size: 44px; }\n    header.masthead{ grid-template-columns: 1fr; }\n    .portrait{ width: 110px; height: 130px; order: -1; }\n    .contact{ text-align: left; }\n    section{ grid-template-columns: 1fr; gap: 14px; }\n    .skill-row, .entry{ grid-template-columns: 1fr; gap: 4px; }\n    .job-head{ grid-template-columns: 1fr; }\n    .langs{ grid-template-columns: 1fr; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  <article class=\"page\" data-screen-label=\"Hoja de vida\">\n\n    <!-- ── Masthead ──────────────────────────────────────────────── -->\n    <header class=\"masthead\">\n      <div class=\"masthead-text\">\n        <div>\n          <h1 class=\"name\">Julieth <em>Rubio<\u002Fem><\u002Fh1>\n          <p class=\"role\">Ingeniera Industrial &nbsp;|&nbsp; Especialista en Gestión de Riesgos Estratégico y Cultura Organizacional<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"contact contact-inline\">\n          <div>Bogotá, Colombia<\u002Fdiv>\n          <div><a href=\"https://wa.me/573208103735\" target=\"_blank\" rel=\"noopener\">+57 320 810 3735<\u002Fa><\u002Fdiv>\n          <div><a href=\"mailto:juliethrubio68@gmail.com\">juliethrubio68@gmail.com<\u002Fa><\u002Fdiv>\n          <div><a href=\"https://linkedin.com/in/julieth-rubio-052490b0\" target=\"_blank\" rel=\"noopener\">linkedin.com/in/julieth-rubio-052490b0<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <img class=\"portrait\" src=\"e054a58c-2504-4114-94d1-a77ab0eb28a5\" alt=\"Retrato de Julieth Rubio\">\n    <\u002Fheader>\n\n    <!-- ── Perfil ────────────────────────────────────────────────── -->\n    <section class=\"profile\">\n      <div class=\"sec-label\"><span class=\"num\">01<\u002Fspan>Perfil<br>profesional<\u002Fdiv>\n      <div class=\"sec-body\">\n        <p>Ingeniera Industrial con trayectoria en gestión integral de riesgos, procesos, gestión de proyectos, control interno, continuidad del negocio y cultura organizacional, certificada como Risk Manager ISO 31000 PECB, con más de 10 años de experiencia en el diseño e implementación de marcos de control operativo, prevención de fraude, corrupción, LAFT, salvaguarda y prevención de la explotación, abuso y acoso sexual (PSEA), así como en la gestión e investigación de quejas sensibles y administración de PQRS en sectores como salud pública, fiduciario-financiero, asegurador, consultoría de innovación y cooperación internacional (ONG).<\u002Fp>\n        <p>He liderado equipos y proyectos estratégicos, tanto presenciales como remotos, enfocados en el fortalecimiento del gobierno corporativo, la mitigación de riesgos financieros y operativos, y la consolidación de culturas organizacionales preventivas. Asimismo, cuento con experiencia en formación y capacitación de equipos corporativos en liderazgo, cultura preventiva y gestión de riesgos.<\u002Fp>\n        <p>Integro pensamiento sistémico y visión estratégica articulando personas, procesos y tecnología, con experiencia en investigación de casos éticos, gestión de stakeholders, reporting ejecutivo y automatización de procesos mediante herramientas digitales e inteligencia artificial. Asimismo, incorporo herramientas de neurociencia aplicada y comportamiento organizacional para fortalecer la toma de decisiones, el liderazgo y la adaptación organizacional en entornos de transformación y cambio.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ── Competencias ──────────────────────────────────────────── -->\n    <section>\n      <div class=\"sec-label\"><span class=\"num\">02<\u002Fspan>Competencias<br>y herramientas<\u002Fdiv>\n      <div class=\"sec-body\">\n\n        <div class=\"skills-group\">\n          <h3>Competencias profesionales<\u002Fh3>\n          <dl class=\"skills\">\n            <div class=\"skill-row\">\n              <dt>Liderazgo &amp; personas<\u002Fdt>\n              <dd>Arquitectura de liderazgo regulado · Medición del riesgo humano organizacional · Formación y desarrollo de equipos · Mapeo de patrones emocionales colectivos <em>(Coach PNL · Neurobiología relacional — Neurociencia aplicada)<\u002Fem><\u002Fdd>\n            <\u002Fdiv>\n            <div class=\"skill-row\">\n              <dt>Estrategia &amp; operación<\u002Fdt>\n              <dd>Pensamiento sistémico y estratégico · Mejoramiento continuo · Gestión de stakeholders · Gestión de la experiencia del cliente · Capacidad analítica<\u002Fdd>\n            <\u002Fdiv>\n            <div class=\"skill-row\">\n              <dt>Comunicación<\u002Fdt>\n              <dd>Comunicación asertiva · Empatía organizacional · Manejo estructurado de quejas · Reporting ejecutivo<\u002Fdd>\n            <\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n        <div class=\"skills-group\">\n          <h3>Herramientas y conocimientos técnicos<\u002Fh3>\n          <dl class=\"skills\">\n            <div class=\"skill-row\">\n              <dt>Datos, reportes &amp; automatización<\u002Fdt>\n              <dd>Power BI · KPIs · Tableros de control · Informes y reporting digitales · Inteligencia artificial aplicada para automatización de procesos con agentes IA · Cuantificación de riesgos · Simulación Montecarlo.<\u002Fdd>\n            <\u002Fdiv>\n            <div class=\"skill-row\">\n              <dt>Riesgos &amp; compliance<\u002Fdt>\n              <dd>ISO 31000 · Riesgos operativos SARO, SIAR, SAC, SAGRILAFT · Riesgos de corrupción y fraude · Riesgos éticos y de género · Due diligence · Protección de datos personales · Tecnológicos · Financieros · Control interno · PQRS · Auditoría interna · Evaluación y monitoreo.<\u002Fdd>\n            <\u002Fdiv>\n            <div class=\"skill-row\">\n              <dt>Gestión de proyectos<\u002Fdt>\n              <dd>Metodologías ágiles · Scrum · Notion · Monday · Asana · Planificación · Seguimiento operativo · OKRs.<\u002Fdd>\n            <\u002Fdiv>\n            <div class=\"skill-row\">\n              <dt>Comunicación &amp; formación<\u002Fdt>\n              <dd>Design thinking · Aprendizaje experiencial · Actividades inmersivas.<\u002Fdd>\n            <\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ── Experiencia ───────────────────────────────────────────── -->\n    <section>\n      <div class=\"sec-label\"><span class=\"num\">03<\u002Fspan>Experiencia<br>profesional<\u002Fdiv>\n      <div class=\"sec-body\">\n\n        <article class=\"job\">\n          <div class=\"job-head\">\n            <h3 class=\"job-title\">Coordinadora de Gestión de Riesgos — Colombia<\u002Fh3>\n            <span class=\"job-dates\">2023 — 2024<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"job-org\">Acción Contra el Hambre · ONG Internacional<\u002Fp>\n          <ul>\n            <li>Lideré equipos, la gestión presupuestal operativa transversal de riesgos (operativos, fraude, datos personales, due diligence, soborno, éticos y género) y proyectos en diferentes territorios, asegurando el cumplimiento de estándares, procesos y calidad de atención.<\u002Fli>\n            <li>Rediseñé el procedimiento de investigación de quejas sensibles incorporando detección temprana de fraude; lideré la creación de un programa digital de formación preventiva, logrando un récord en identificación de situaciones críticas.<\u002Fli>\n            <li>Lideré el sistema de protección de datos personales, quejas sensibles, due diligence, prevención del fraude y mecanismo de retroalimentación para Colombia y el proceso de implementación de SAGRILAFT, gestión de auditorías y cumplimiento.<\u002Fli>\n            <li>Coordiné equipos multidisciplinarios para Colombia, fortaleciendo capacidades de servicio y relacionamiento con aliados y comunidades en múltiples territorios.<\u002Fli>\n            <li>Integré metodologías ágiles en la operación del área, siendo reconocida como referente de liderazgo colaborativo y gestión orientada a resultados.<\u002Fli>\n            <li>Coordiné auditorías internas de riesgos, brindé formación especializada a equipos de terreno y socios, y ejercí como punto focal de protección contra la explotación y el abuso sexual (PSEA) para Colombia.<\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n\n        <article class=\"job\">\n          <div class=\"job-head\">\n            <h3 class=\"job-title\">Directora de Proyectos y Experiencia del Cliente<\u002Fh3>\n            <span class=\"job-dates\">2020 — 2023<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"job-org\">Widpal SAS · Consultoría y Tecnología Empresarial<\u002Fp>\n          <ul>\n            <li>Lideré la operación y ejecución de proyectos comerciales, coordinando equipos de diseño, desarrollo y atención al cliente.<\u002Fli>\n            <li>Implementé tableros de control e indicadores de desempeño (ventas, tiempos, satisfacción) para la toma de decisiones estratégicas con Power BI.<\u002Fli>\n            <li>Reduje en un 30% los tiempos de entrega mediante optimización de procesos y trabajo colaborativo entre equipos operativos.<\u002Fli>\n            <li>Diseñé procesos de onboarding, seguimiento y fidelización de clientes que mejoraron significativamente el NPS.<\u002Fli>\n            <li>Creé modelos ágiles para la ejecución de actividades, mejorando la productividad y la experiencia del cliente.<\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n\n        <article class=\"job\">\n          <div class=\"job-head\">\n            <h3 class=\"job-title\">Profesional Ejecutiva de Riesgos y Entes de Control<\u002Fh3>\n            <span class=\"job-dates\">2018 — 2020<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"job-org\">Fiduprevisora — USPEC · Unidad Servicios Penitenciarios y Carcelarios (Fondo Atención Salud PPL)<\u002Fp>\n          <ul>\n            <li>Coordiné procesos operativos y equipos de atención a usuarios internos y externos, asegurando calidad, trazabilidad y continuidad de la operación.<\u002Fli>\n            <li>Representé a la entidad en juntas directivas y mesas técnicas con USPEC, INPEC, Ministerio de Salud y entes de control, liderando el enfoque preventivo en gestión de riesgos públicos.<\u002Fli>\n            <li>Estructuré el cálculo de reservas de riesgo con base en el apetito organizacional, fortaleciendo la capacidad financiera para minimizar procesos jurídicos y de defensa judicial.<\u002Fli>\n            <li>Diseñé y ejecuté el plan de continuidad del negocio y contingencia para transiciones en remoto.<\u002Fli>\n            <li>Desarrollé estrategias de capacitación que incrementaron la cultura organizacional de riesgos en líderes de área y personal operativo.<\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n\n        <article class=\"job\">\n          <div class=\"job-head\">\n            <h3 class=\"job-title\">Profesional Senior — Sistema de Riesgo Operativo<\u002Fh3>\n            <span class=\"job-dates\">2016 — 2018<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"job-org\">Fiduprevisora — Consorcio SAYP (FOSYGA / Ministerio de Salud)<\u002Fp>\n          <ul>\n            <li>Implementé y fortalecí procesos de control operativo y seguimiento en áreas clave (pagos, jurídica y administrativa), garantizando orden y trazabilidad.<\u002Fli>\n            <li>Diseñé y ejecuté estrategias preventivas para la identificación y manejo de situaciones críticas, protegiendo la reputación institucional y la gestión de recursos.<\u002Fli>\n            <li>Corregí alertas operativas oportunamente, evitando sanciones económicas y contractuales, y generé ahorros presupuestales mediante controles preventivos.<\u002Fli>\n            <li>Consolidé una cultura de trabajo preventivo y ordenado, replicada como buena práctica interna de la organización.<\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n\n        <article class=\"job\">\n          <div class=\"job-head\">\n            <h3 class=\"job-title\">Coordinadora de Proyectos — Innovación y Formación<\u002Fh3>\n            <span class=\"job-dates\">2015 — 2016<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"job-org\">Terra Mater (Insight Box) · Consultora en Formación e Innovación<\u002Fp>\n          <ul>\n            <li>Lideré la planificación, ejecución y seguimiento de proyectos de innovación y desarrollo humano, articulando la dimensión estratégica y operativa.<\u002Fli>\n            <li>Diseñé y facilité sesiones formativas en habilidades de liderazgo, comunicación, trabajo en equipo y pensamiento creativo para equipos directivos y organizaciones.<\u002Fli>\n            <li>Apliqué design thinking, aprendizaje experiencial y herramientas visuales colaborativas para cocrear soluciones organizacionales ajustadas a cada cliente.<\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n\n        <article class=\"job\">\n          <div class=\"job-head\">\n            <h3 class=\"job-title\">Analista / Asistente Técnica Nacional — Automóviles y SOAT<\u002Fh3>\n            <span class=\"job-dates\">2008 — 2015<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"job-org\">Seguros Bolívar · Aseguradora<\u002Fp>\n          <ul>\n            <li>Lideré procesos clave de la operación técnica, normativa y comercial del ramo de automóviles y SOAT a nivel nacional.<\u002Fli>\n            <li>Impulsé un crecimiento del 80% en pólizas digitales liderando capacitaciones nacionales en expedición web y reduciendo errores operativos en intermediarios y contact centers.<\u002Fli>\n            <li>Garanticé el cumplimiento nacional en aplicación de tarifas y contribuciones, previniendo sanciones regulatorias ante entes de control.<\u002Fli>\n            <li>Participé en mesas intersectoriales con Fasecolda, Ministerio de Salud, RUNT y Ministerio de Transporte para el desarrollo de la Malla Validadora MUI.<\u002Fli>\n          <\u002Ful>\n        <\u002Farticle>\n\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ── Logros ────────────────────────────────────────────────── -->\n    <section>\n      <div class=\"sec-label\"><span class=\"num\">04<\u002Fspan>Logros<br>cuantificables<br>destacados<\u002Fdiv>\n      <div class=\"sec-body\">\n        <ol class=\"achievements\">\n          <li>Creación e implementación de modelo de gestión de riesgos para el sector ONG internacional ISO 31000, diseñando un marco adaptado a las particularidades operativas, éticas y de cumplimiento de organizaciones humanitarias en contextos de alta vulnerabilidad (nuevo modelo para el sector).<\u002Fli>\n          <li>Récord organizacional en detección de fraude mediante rediseño de procedimientos y programa digital de formación preventiva — Acción Contra el Hambre.<\u002Fli>\n          <li>Referente de modelo de riesgos para el Grupo de Transferencias Monetarias (GTM) del sector humanitario en Colombia.<\u002Fli>\n          <li>Mejora de procesos y eficiencia en gestión de PQRS mediante rediseño del ciclo de atención de peticiones, quejas y reclamos, reduciendo tiempos de respuesta y fortaleciendo la trazabilidad — Acción Contra el Hambre.<\u002Fli>\n          <li>Representación institucional ante Ministerios, INPEC, USPEC y entes de control, consolidando el enfoque preventivo en riesgos públicos y participación en mesas de trabajo de innovación.<\u002Fli>\n          <li>Ahorros presupuestales por minimización de tutelas y efectos jurídicos en Fiduprevisora por identificaciones de causa raíz.<\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ── Educación ─────────────────────────────────────────────── -->\n    <section>\n      <div class=\"sec-label\"><span class=\"num\">05<\u002Fspan>Educación<\u002Fdiv>\n      <div class=\"sec-body\">\n        <div class=\"entry\">\n          <div>\n            <h4>Ingeniería Industrial<\u002Fh4>\n            <p class=\"meta\">Universidad ECCI — Escuela Colombiana de Carreras Industriales<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"when\">2014<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"entry\">\n          <div>\n            <h4>Especialista en Gerencia de Seguridad y Salud en el Trabajo<\u002Fh4>\n            <p class=\"meta\">Universidad ECCI — Escuela Colombiana de Carreras Industriales<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"when\">2014 — 2015<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"entry\">\n          <div>\n            <h4>Ciencias del Comportamiento Organizacional<\u002Fh4>\n            <p class=\"meta\">Universidad de los Andes<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"when\">En proceso<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ── Certificaciones ───────────────────────────────────────── -->\n    <section>\n      <div class=\"sec-label\"><span class=\"num\">06<\u002Fspan>Certificaciones<br>internacionales<\u002Fdiv>\n      <div class=\"sec-body\">\n        <div class=\"entry\">\n          <div>\n            <h4>Risk Manager — ISO 31000<\u002Fh4>\n            <p class=\"meta\">PECB Canadá — Certificación Internacional<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"when\">2019<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"entry\">\n          <div>\n            <h4>Certified Trauma Somático — Neurobiología relacional / Neurociencia aplicada<\u002Fh4>\n            <p class=\"meta\">International Association of Trauma Professionals (IATP) — EE. UU. · NEUROSOMA<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"when\">—<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"entry\">\n          <div>\n            <h4>Coach en PNL — Programación Neurolingüística<\u002Fh4>\n            <p class=\"meta\">Certificación profesional<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"when\">—<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ── Formación complementaria ──────────────────────────────── -->\n    <section>\n      <div class=\"sec-label\"><span class=\"num\">07<\u002Fspan>Formación<br>complementaria<\u002Fdiv>\n      <div class=\"sec-body\">\n        <ul class=\"pills\">\n          <li>Riesgo Estratégico y TI — Nivel Ejecutivo<\u002Fli>\n          <li>Anti-soborno, Corrupción y Abuso de Poder<\u002Fli>\n          <li>Trans
